<header class="flex items-center justify-between gap-4 px-6 lg:px-10 py-6 sticky top-0 z-20
  bg-mist/80 dark:bg-ink/80 backdrop-blur-xl border-b border-black/5 dark:border-white/5">

  <div class="flex items-center gap-3">
    <button onclick="toggleSidebar()" class="lg:hidden p-2 -ml-2 rounded-xl hover:bg-black/5 dark:hover:bg-white/5">
      <i data-lucide="menu" class="w-5 h-5 text-[#101312] dark:text-white"></i>
    </button>
    <div>
      <h1 class="font-display text-lg sm:text-xl font-bold text-[#101312] dark:text-white leading-tight">
        {{ greeting }}, {{ user.name }}
      </h1>
      <p class="text-xs sm:text-sm text-[#6b7066] dark:text-muted">{{ today }}</p>
    </div>
  </div>

  <div class="flex items-center gap-2 sm:gap-3">
    <button @click="toggle()" title="Toggle theme"
      class="w-10 h-10 rounded-2xl flex items-center justify-center bg-white dark:bg-ink-card
             border border-black/5 dark:border-white/5 hover:border-leaf/40 transition-colors">
      <i data-lucide="sun" class="w-[18px] h-[18px] text-[#101312]" x-show="!dark" x-cloak></i>
      <i data-lucide="moon" class="w-[18px] h-[18px] text-leaf" x-show="dark" x-cloak></i>
    </button>

    <button title="Notifications"
      class="relative w-10 h-10 rounded-2xl flex items-center justify-center bg-white dark:bg-ink-card
             border border-black/5 dark:border-white/5 hover:border-leaf/40 transition-colors">
      <i data-lucide="bell" class="w-[18px] h-[18px] text-[#101312] dark:text-white"></i>
      <span class="absolute top-2 right-2.5 w-1.5 h-1.5 rounded-full bg-leaf"></span>
    </button>

    <div class="w-10 h-10 rounded-2xl bg-gradient-to-br from-leaf to-leaf-deep flex items-center justify-center
                font-display font-bold text-ink text-sm shrink-0">
      {{ user.name[0] | upper }}
    </div>
  </div>
</header>
